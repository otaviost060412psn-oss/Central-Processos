   for(let d=de;d<=ate;d=exSoma(d,31)){const f=[exSoma(d,30),ate].sort()[0];lim(await DB.agendaList({pessoa:'*',encerradas:true,desde:new Date(d+'T00:00:00').getTime(),ate:new Date(f+'T23:59:59.999').getTime()})).forEach(x=>C.set(x.id,x))}
   buildSlidesAg({abertas:lim(ab),concl:[...C.values()],agenda:lim(agd).filter(x=>x.tipo==='agenda')},de,ate)}
  else if(m==='pm')buildSlidesPm(lim(await DB.regList('projeto')),de,ate);
  else if(m==='rel'){if(!stRel)throw new Error('Escolha o setor.');const st=stRel;
   const[ra,rs,rm]=await Promise.all([DB.regList('monit_agente'),DB.regList('monit_setor'),DB.regList('monitoria',{de,ate})]);
   buildSlidesRel(st,lim(ra),lim(rs).find(x=>x.data.setor===st.id)||null,lim(rm).filter(x=>x.data.setor===st.id&&x.data.data>=de&&x.data.data<=ate),de,ate)}
  else if(m==='mon'){const[ra,rm]=await Promise.all([DB.regList('monit_agente'),DB.regList('monitoria',{de:moDatas(mes)[0],ate:moDatas(moMesSoma(mes,1))[1]})]);
   buildSlidesMon(lim(ra),lim(rm).filter(x=>moMesRef(x)===mes),mes)}
  else{const[re,rd]=await Promise.all([DB.regList('jornada_etapa'),DB.regList('diagnostico'),anGarantir()]);buildSlidesAn(lim(re),lim(rd))}
 }catch(e){if(tk===presTok)toast(e.message||'Não foi possível preparar a apresentação.',true);return}
 if(tk!==presTok||page!==pg||!meId||!isAdmin())return;
 if(m==='an'){if(!pqPronto())toast('Perguntas-chave e Por setor ficaram de fora: os dados não terminaram de carregar.',true);else if(JR.limitado||DG.limitado||PJ.limitado)limitado=true}
 if(limitado)toast('Atenção: havia registros demais e parte deles ficou de fora da apresentação.',true);
 /* no relatório, monitorias cortadas pelo limite deixariam a 2ª metade incompleta: não gera o arquivo */
 if(m==='rel'&&limitado)return toast('Há monitorias demais neste período: escolha um período menor.',true);
 if(m==='rel'){const st=stRel,arq=String(st?st.nome:'setor').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'setor';presBaixar(`Relatório de qualidade · ${st?st.nome:''} · ${dfmt(de)} a ${dfmt(ate)}`,`relatorio-qualidade-${arq}-${de}-a-${ate}.html`);return}
 if(baixar)m==='ag'?presBaixar(`Agenda e Demandas · ${dfmt(de)} a ${dfmt(ate)}`,`apresentacao-agenda-${de}-a-${ate}.html`):m==='pm'?presBaixar(`Projetos · ${dfmt(de)} a ${dfmt(ate)}`,`apresentacao-projetos-${de}-a-${ate}.html`):m==='mon'?presBaixar(`Monitorias · ${dgMesNome(mes)}`,`apresentacao-monitorias-${mes}.html`):presBaixar(`Análises · ${dfmt(today())}`,`apresentacao-analises-${today()}.html`);
 else presAbrir()}
function show(i,back){si=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.sl').forEach((el,k)=>{el.classList.remove('on','bk');if(k===si){void el.offsetWidth;el.classList.add('on');if(back)el.classList.add('bk')}});
 document.querySelectorAll('#psegs i').forEach((el,k)=>el.classList.toggle('on',k<=si));$('pwhere').textContent=slides[si].t;$('pcount').textContent=`${si+1} / ${slides.length}`;$('pprev').disabled=si===0;$('pnext').disabled=si===slides.length-1}
const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform=`translate(-50%,-50%) scale(${k})`};
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function fsToggle(){try{const p=fsOn()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(el=>(el.requestFullscreen||el.webkitRequestFullscreen).call(el))(document.documentElement);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function fsLabel(){$('pfs').setAttribute('aria-label',fsOn()?'Sair da tela cheia':'Tela cheia');$('pfs').title=fsOn()?'Sair da tela cheia (F)':'Tela cheia (F)';$('pfs').classList.toggle('on',fsOn())}
function startPres(L,modo){if(!L||!L.length)return;buildSlides(L,modo);presAbrir()}
function presAbrir(){$('pres').classList.add('on');$('pres').setAttribute('aria-hidden','false');fit();show(0);if(!fsOn())fsToggle()}
function closePres(){$('pres').classList.remove('on');$('pres').setAttribute('aria-hidden','true');if(fsOn())fsToggle()}
$('pnext').onclick=()=>show(si+1);$('pprev').onclick=()=>show(si-1,true);$('pclose').onclick=closePres;$('pfs').onclick=fsToggle;
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{fsLabel();setTimeout(fit,60)}));
$('psegs').addEventListener('click',e=>{const i=e.target.dataset.si;if(i!==undefined)show(+i,+i<si)});
$('slides').addEventListener('click',e=>{const b=e.target.closest('[data-swn]');if(!b)return;const p=PWL[+b.dataset.swn];document.querySelectorAll('#swn button.on').forEach(x=>{x.classList.remove('on');x.classList.add('seen')});b.classList.remove('seen');b.classList.add('on');const c=$('swbig');c.classList.remove('wait');c.innerHTML=p.words.length===1?`<small>${esc(p.nome)}</small><b>${esc(p.words[0].palavra)}</b>`:`<small>${esc(p.nome)}</small><div class="swl">${p.words.map(x=>`<div><span>${dshort(x.sem)}</span><b>${esc(x.palavra)}</b></div>`).join('')}</div>`;c.animate&&c.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.2,.8,.2,1)'});b.blur()});
addEventListener('resize',()=>$('pres').classList.contains('on')&&fit());
document.addEventListener('keydown',e=>{if(!$('pres').classList.contains('on'))return;
 if(['Enter',' '].includes(e.key)&&e.target.closest&&e.target.closest('.swn'))return;
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(si+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(si-1,true)}else if(e.key==='Escape'){if(!fsOn())closePres()}else if(e.key==='f'||e.key==='F')fsToggle()});

/* ---------- dados e início ---------- */
async function onData(d){
 S.settings=d.settings;S.weeks=d.weeks||{};S.users=d.users||[];
 if(!me()){toast('Seu acesso a este sistema foi removido.',true);await DB.logout();return}
 const cur=mondayOf(new Date());
 if(!S.weeks[cur]){try{await DB.createWeek(cur,emptyWeek(cur))}catch(e){}if(!S.weeks[cur])S.weeks[cur]=emptyWeek(cur)}
 if(isAdmin()&&!(S.settings&&S.settings.colabMigrado)&&!migrating){migrating=true;try{for(const[id,w]of Object.entries(S.weeks)){if(w.palavras&&Object.keys(w.palavras).length){await DB.update(id,{palavras:{}});w.palavras={}}}const st=ST();st.colaboradores=(S.settings&&S.settings.colaboradores)||[];st.colabMigrado=true;['pessoas','metaQualidade','regraQualidade','limiteDias','horasDia'].forEach(k=>delete st[k]);await DB.saveSettings(st);S.settings=st}catch(e){toast(e.message||errMsg(e),true)}migrating=false}
 if(!sel||!S.weeks[sel]){const p=prevOf(cur);sel=new Date().getDay()===1&&p?p.inicio:cur}
 if(page==='agenda')agCarregar(true);
 if(page==='an-jornada'||(page==='config'&&cfgView==='jornada'))jrCarregar();
 if(page==='config'&&(cfgView==='monitcrit'||cfgView==='monitag'))monCarregar();
 if(page==='monitorias'){monCarregar();moCarregar()}
 if((page==='qualidade'||page==='inicio')&&sel)maMesesDe([sel]).forEach(maCarregarMes);
 if(page==='an-diag'||page==='an-jornada')dgCarregar();if(page==='an-diag')jrCarregar();
 if(page==='pm-proj'||page==='pm-fut'||page==='an-diag'||page==='an-perg'||page==='an-setor')pjCarregar();if(page==='pm-proj'||page==='pm-fut'||page==='an-perg'||page==='an-setor'){jrCarregar();dgCarregar()}
 render();
}
async function boot(){
 try{await DB.init()}catch(e){$('login').hidden=false;loginErr('Não foi possível conectar ao banco de dados. Verifique a internet e recarregue a página.');return}
 DB.onAuth(u=>{
  if(u){meId=u.id;$('login').hidden=true;$('app').hidden=false;$('loading').hidden=false;document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));page='inicio';cfgView=null;DB.watch(onData)}
  else{meId=null;sel=null;closeEd();closeMenu();$('app').hidden=true;$('login').hidden=false;$('lp').value='';if($('pres').classList.contains('on'))closePres()}
 });
}
boot();
})();
