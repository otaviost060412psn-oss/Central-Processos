*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* marca: símbolo + divisor + escrita */
.brand{display:inline-flex;align-items:center;gap:calc(var(--bh)*.45);--bh:28px;color:var(--pri)}
.brand .sym{height:var(--bh);width:calc(var(--bh)*.721)}
.brand .div{width:1px;height:calc(var(--bh)*.8);background:#5C6D65}
.brand .wm{height:var(--bh);width:calc(var(--bh)*3.543)}
.brand svg{overflow:visible;display:block}


/* botões e campos (cápsula) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:99px;padding:0 18px;border:1px solid var(--bd2);background:transparent;font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}
.btn.pri:hover{background:var(--pri-h)}
.btn.ghost{border-color:transparent;color:var(--mu)}
.btn.ghost:hover{color:var(--tx);background:var(--card2)}
.btn.dan{border-color:rgba(242,102,90,.5);color:var(--er)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.ico{width:36px;height:36px;border-radius:99px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;color:var(--mu)}
.ico:hover{border-color:var(--bd);color:var(--tx);background:var(--card2)}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--mu)}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 18px,calc(100% - 15px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.f input,.f textarea,.f select{width:100%;height:42px;background:var(--in);border:1px solid var(--inb);border-radius:12px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
.f textarea{height:auto;min-height:76px;padding:10px 14px;resize:vertical;line-height:1.45}
.f input:hover,.f textarea:hover{border-color:var(--bd2)}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,197,137,.2)}
.f.bad input{border-color:var(--er)}
.f .msg{font-size:12px;color:var(--mu2);min-height:18px}
.f.bad .msg{color:var(--er)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--card2);color:var(--tx)}
.chip.ok{background:rgba(61,220,106,.13);color:var(--ok)}.chip.wa{background:rgba(245,185,79,.13);color:var(--wa)}.chip.er{background:rgba(242,102,90,.14);color:var(--er)}
.chip.ln{background:none;box-shadow:inset 0 0 0 1px var(--bd2);color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu2);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.wa{background:var(--wa)}.dot.er{background:var(--er)}

/* ===== login: cartão centralizado com foto ===== */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 20px}
.lg-card{width:min(1000px,100%);min-height:min(620px,calc(100vh - 120px));display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.lg-form{display:flex;align-items:center;justify-content:center;padding:48px clamp(28px,4vw,56px)}
.lg-form form{width:100%;max-width:380px;display:grid;gap:14px}
.lg-head{display:grid;justify-items:center;gap:14px;text-align:center;margin-bottom:10px}
.lg-head .brand{--bh:34px}
.lg-head h1{font-size:24px;line-height:1.2;letter-spacing:-.02em}
.pwd{position:relative;width:100%}.pwd input{padding-right:48px}
.pwd .eye{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:none;border-radius:99px;display:grid;place-items:center;color:var(--mu)}
.pwd .eye:hover{color:var(--tx);background:var(--card2)}
.keep{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);cursor:pointer;width:max-content}
.keep input{appearance:none;width:18px;height:18px;margin:0;border:1px solid var(--bd2);border-radius:5px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.keep input:checked{background:var(--pri);border-color:var(--pri)}
.keep input:checked::after{content:'';width:5px;height:9px;border:solid var(--on);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.lg-form .btn.pri{height:48px;font-size:15px;margin-top:4px}
.lg-err{color:var(--er);font-size:14px;min-height:20px;margin:-4px 0 -6px}
.lg-img{position:relative;background:#06100B}
.lg-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%}
.lg-foot{font-size:13px;color:var(--mu2)}
.demo{font-size:13px;color:var(--mu2);border:1px dashed var(--bd2);border-radius:12px;padding:10px 12px}
.demo b{color:var(--tx)}
.beams{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);transform:rotate(28deg);pointer-events:none}

/* usuários */
.cfg{max-width:960px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:140px}
.tile:hover{background:var(--card2)}
.tile .ti{width:40px;height:40px;border-radius:12px;background:rgba(15,197,137,.12);color:var(--pri);display:grid;place-items:center}
.tile b{font-size:17px;font-weight:600}
.tile span{color:var(--mu);font-size:13px;line-height:1.4}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.uc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:left;display:grid;gap:12px;justify-items:start;transition:background .12s}
.uc:hover{background:var(--card2)}
.uc .av{width:40px;height:40px;border-radius:50%;background:var(--card2);color:var(--pri);font-size:16px;font-weight:600;display:grid;place-items:center}
.uc:hover .av{background:var(--bd)}
.uc b{display:block;font-size:16px;font-weight:500}
.uc small{display:block;font-size:13px;color:var(--mu)}
.uc .me{font-size:12px;color:var(--mu2)}
.uc.add{border-style:dashed;background:none;place-items:center;align-content:center;color:var(--mu);font-weight:500;min-height:170px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--card2);transition:.2s;pointer-events:none}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:.2s}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{transform:translateX(18px);background:var(--on)}
.sw input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
.swl{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.swl small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.wst{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:22px}
.wst .tx{flex:1;min-width:220px}.wst b{display:block;font-weight:600;font-size:15px}.wst small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.btn.lk{border-color:rgba(245,185,79,.55);color:var(--wa)}.btn.lk:hover{background:rgba(245,185,79,.1)}
.wkl{display:grid}.wkr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.wkr:last-child{border-bottom:0}.wkr .n{flex:1;min-width:160px;font-weight:500}.wkr .n small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.note{font-size:13px;color:var(--wa);background:rgba(245,185,79,.08);border:1px solid rgba(245,185,79,.3);border-radius:12px;padding:10px 12px}

/* ===== topo ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:12px var(--pad);background:rgba(23,23,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgba(23,23,23,.94)}
.top .burger,.top .tema{width:40px;height:40px;border-radius:99px;border:1px solid var(--bd);background:transparent;display:grid;place-items:center}
.top .tema{flex:none}
.top .burger:hover,.top .tema:hover{background:var(--card2)}
.top .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em}
.step{position:relative;display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:99px;height:38px}
.step button{width:36px;height:36px;border:0;background:none;border-radius:99px;display:grid;place-items:center;color:var(--tx)}
.step button:hover:not([aria-disabled="true"]){background:var(--card2)}
.step button[aria-disabled="true"]{color:var(--bd2);cursor:default}
.wsel{position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.wbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--bd);border-radius:99px;background:none;font-size:14px;font-weight:500;white-space:nowrap}
.wbtn:hover,.wbtn[aria-expanded="true"]{background:var(--card2);border-color:var(--bd2)}
.wbtn .ch{width:6px;height:6px;border-right:1.6px solid var(--mu);border-bottom:1.6px solid var(--mu);transform:translateY(-2px) rotate(45deg)}
.wbtn .lk,.wpw .lk{width:6px;height:6px;border-radius:50%;background:var(--wa);flex:none}
#wp{position:absolute;top:calc(100% + 8px);right:0;z-index:40;width:min(320px,calc(100vw - 24px));background:var(--card);border:1px solid var(--bd2);border-radius:16px;padding:14px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.wpy{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wpy b{font-size:15px;font-weight:600}
.wpy button{width:32px;height:32px;border:0;background:none;border-radius:99px;display:grid;place-items:center;color:var(--tx)}
.wpy button:hover:not([aria-disabled="true"]){background:var(--card2)}
.wpy button[aria-disabled="true"]{color:var(--bd2);cursor:default}
.wpm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wpm button{height:34px;border:1px solid var(--bd);background:none;border-radius:10px;font-size:13px;color:var(--mu)}
.wpm button:hover:not(:disabled){color:var(--tx);border-color:var(--bd2);background:var(--card2)}
.wpm button.on{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:500}
.wpm button:disabled{border-color:transparent;color:var(--bd2);cursor:default}
.wph{font-size:12px;color:var(--mu);margin:14px 2px 8px}
.wpw{display:flex;flex-wrap:wrap;gap:6px}
.wpw button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border:1px solid var(--bd);background:none;border-radius:99px;font-size:13px;font-weight:500;color:var(--mu)}
.wpw button:hover{color:var(--tx);background:var(--card2)}
.wpw button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.wpl{display:flex;gap:14px;font-size:12px;color:var(--mu2);margin-top:12px}
.wkg{font-size:12px;font-weight:500;color:var(--mu);padding:14px 16px 6px;border-bottom:1px solid var(--bd)}
.top .sp{flex:1}

/* ===== menu lateral recolhível ===== */
#scrim{position:fixed;inset:0;background:rgba(5,9,8,.6);z-index:44;opacity:0;visibility:hidden;transition:.25s}
#scrim.on{opacity:1;visibility:visible}
/* trilho de ícones (áreas) + painel com as páginas da área; no computador ficam fixos, no celular abrem pelo botão do topo */
#menu{position:fixed;left:0;top:0;bottom:0;max-width:92vw;display:flex;background:var(--bg);border-right:1px solid var(--ln);z-index:45;transform:translateX(-102%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#menu.on{transform:none;visibility:visible}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rlogo{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:#0FC589;color:#171717;margin-bottom:12px}
.rlogo svg{width:19px;height:27px;display:block;overflow:visible}
.lg-head .rlogo{width:64px;height:64px;border-radius:18px;margin:0}
.lg-head .rlogo svg{width:30px;height:42px}
.rails{display:grid;gap:6px}
.rails button{width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--mu);display:grid;place-items:center}
.rails button:hover{background:var(--card);color:var(--tx)}
.rails button.sel{background:var(--card2);color:var(--tx)}
.rails button[aria-current="true"]{color:var(--pri)}
.avatar{margin-top:auto;width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--pri);color:var(--on);font-size:13px;font-weight:600;display:grid;place-items:center}
.avatar:hover,.avatar[aria-expanded="true"]{box-shadow:0 0 0 3px var(--card2)}
.painel{width:min(250px,calc(92vw - 65px));flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 12px;overflow-x:hidden;overflow-y:auto;min-height:0;border-left:1px solid var(--ln)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 10px}
.ph b{font-size:16px;font-weight:600}
.pfoot{margin-top:auto;font-size:12px;color:var(--mu2);padding:0 10px}
.nav{display:grid;gap:2px}
.nav .grp{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--mu);font-weight:500;font-size:14px}
.nav button:hover{background:var(--card);color:var(--tx)}
.nav button.on{background:var(--card2);color:var(--pri)}
.nav .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
/* cartão da conta (bolinha com as iniciais) */
#ucard{position:fixed;left:76px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:47;width:min(290px,calc(100vw - 88px));background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.uch{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px;min-width:0}
.uch .avatar{margin:0;cursor:default}
.uch b{display:block;font-size:14px;overflow-wrap:anywhere}
#who{display:block;font-size:12px;color:var(--mu);overflow-wrap:anywhere}
.ucb{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:10px;color:var(--tx);font-size:14px;text-align:left}
.ucb:hover{background:var(--card2)}
.ucb .v{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
#logout{border-top:1px solid var(--bd);border-radius:0 0 10px 10px;margin-top:6px}
.top .pnl{display:none}
.top .burger.pnl{border:0;border-radius:10px}
@media (min-width:901px){
 #menu{transform:none;visibility:visible;transition:none;max-width:none}
 #app{padding-left:315px;transition:padding-left .25s ease}
 .painel>*{min-width:226px}
 .top .pnl+.ttl{border-left:1px solid var(--ln);padding-left:14px}#app.pfechado{padding-left:65px}
 .painel{transition:width .25s ease,padding .25s ease,border-width .25s ease,visibility 0s}
 #app.pfechado .painel{width:0;padding-left:0;padding-right:0;border-left-width:0;visibility:hidden;transition:width .25s ease,padding .25s ease,border-width .25s ease,visibility 0s .25s}
 .top .burger:not(.pnl),#menuClose,#scrim{display:none}.top .pnl{display:grid}
}
/* categorias do menu (abrem e fecham) e áreas só de administrador */
.nav .cat .chev{margin-left:auto;transition:transform .2s}
.nav .cat[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav .cat[aria-expanded="true"],.nav .cat.tem{color:var(--tx)}
.nav .cat.tem:not([aria-expanded="true"]){box-shadow:inset 3px 0 0 var(--bd2)}
.nav .sub{display:grid;gap:2px;padding-left:30px}
.nav .sub button{padding:9px 12px;font-size:13.5px}
.nav .eb{margin-left:auto;font-size:11px;color:var(--mu2);border:1px solid var(--bd);border-radius:99px;padding:1px 8px;white-space:nowrap}
.nao-adm .so-adm{display:none!important}
.embreve{display:grid;gap:10px;justify-items:start;max-width:640px}

/* ===== páginas ===== */
.main{padding:0 var(--pad) 96px}
.page{max-width:1320px;margin:0 auto;display:none}
.page.on{display:block}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:30px 0 22px}
.kick{font-size:14px;font-weight:500;color:var(--pri);margin:0 0 6px}
.phead h1{font-size:clamp(28px,3vw,38px);line-height:1.1}
.phead .sub{margin:8px 0 0;color:var(--mu);max-width:64ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-top:32px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sech h2{font-size:20px;line-height:1.25}
.sech p{margin:4px 0 0;color:var(--mu);font-size:14px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:var(--cp)}
.banner{display:flex;align-items:center;gap:12px;border:1px solid rgba(245,185,79,.4);background:rgba(245,185,79,.08);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.banner b{font-weight:600}

/* cards de indicador (estilo 2) */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;min-width:0}
.kpi .l{font-size:13px;color:var(--mu)}
.kpi .v{font-size:clamp(26px,2.6vw,36px);font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:8px 0 12px}
.kpi .v.er{color:var(--er)}.kpi .v.wa{color:var(--wa)}
.kpi .d{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mu)}

/* alertas: painel resumo */
.alp{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.alh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;background:none;border:0;padding:14px 18px;text-align:left}
.alh b{font-size:15px;font-weight:600}
.alh .tg{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}
.alh .tg svg{transition:transform .2s}
.alp.closed .alh .tg svg{transform:rotate(180deg)}
.alp.closed .all{display:none}
.all{border-top:1px solid var(--bd)}
.ali{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:11px 18px;text-align:left;font-size:14px}
.ali:last-child{border-bottom:0}
.ali:hover{background:var(--card2)}
.ali span.t{flex:1;min-width:0}
.ali .go{color:var(--mu);font-size:13px;white-space:nowrap}
.alok{display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:14px}

/* início: duas colunas */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.colh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.colh h2{font-size:22px}
.cols .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin-top:12px}

/* tabela (estilo 1) */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mu);padding:10px 14px;border-bottom:1px solid var(--bd)}
td{padding:13px 14px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:14px}
th.n,td.n{text-align:right}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--card2)}
tbody tr:hover td.act{color:var(--tx)}
td .nm{font-weight:500}
td .by{display:block;font-size:12px;color:var(--mu2);margin-top:2px}
td.act{width:44px;color:var(--bd2);text-align:right}
.none{color:var(--mu2)}
tfoot td{font-weight:600;border-top:1px solid var(--bd2);border-bottom:0}

.jrarcos{position:relative}
.jrarcos svg{position:absolute;inset:0;overflow:visible}
.jrlab{position:absolute;transform:translate(-50%,-50%);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:1.3;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--c);color:var(--tx)}
button.jrlab{cursor:pointer}
button.jrlab:hover{background:var(--card2)}
.jrli{display:inline-block;width:22px;vertical-align:middle}
.jrc{flex:0 0 210px;min-width:0;max-width:210px;display:grid;gap:8px;align-content:start;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;color:var(--tx)}
.jrc.ed{padding:0;display:flex;flex-direction:column;gap:0}
.jrc.ed:hover{border-color:var(--pri)}
.jrcb{flex:1;display:grid;gap:8px;align-content:start;text-align:left;background:none;border:0;border-radius:12px 12px 0 0;padding:14px 14px 6px;color:inherit}
.jrmv{display:flex;justify-content:space-between;padding:2px 6px 6px}
.jrmv .ico[aria-disabled="true"]{opacity:.3;cursor:default}
.jrnova{display:flex;align-items:center;justify-content:center;gap:8px;border-style:dashed;color:var(--mu);min-height:120px;font-weight:500}
.jrnova:hover{color:var(--tx)}
.jrtags{display:flex;flex-wrap:wrap;gap:6px}
.jrtags:empty{display:none}
.jrrm{display:grid;place-items:center;width:18px;height:18px;margin-right:-4px;border:0;border-radius:99px;background:none;color:var(--mu);padding:0}
.jrrm:hover{color:var(--tx);background:var(--bd)}
.jrrm svg{width:12px;height:12px}
.jrc:hover{border-color:var(--bd2)}
.jrc.on{border-color:var(--pri);background:var(--card2)}
.jrc .k{font-size:12px;color:var(--mu)}
.jrc b{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.jrc small{font-size:12px;color:var(--mu)}
.jrc.jrq{box-shadow:inset 0 4px 0 var(--q)}
.jrqt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--tx)}
.jrqi{display:inline-block;flex:none;width:14px;height:4px;border-radius:2px;background:var(--q)}
.jrqt .jrqi{width:8px;height:8px;border-radius:50%}
.jrqleg{margin:0 0 12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.jrprob{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.jrpb{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);cursor:pointer}
.jrpb:hover{border-color:var(--bd2);background:var(--card2)}
.jrpb>span:first-child{flex:1 1 200px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.jrpch{display:flex;flex-wrap:wrap;gap:6px}
.jrst{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
/* setor de nome longo quebra a linha em vez de alargar o cartão (o desenho das linhas depende da largura fixa) */
.jrst .chip{white-space:normal;overflow-wrap:anywhere;max-width:100%}
.jrcb{min-width:0}
.jrseta{flex:0 0 44px;align-self:center;text-align:center;color:var(--mu);font-size:18px}
.jrdet{display:grid;gap:18px}
.jrdet h2{font-size:20px}
.jrdet h3{font-size:14px;font-weight:600;margin-bottom:6px}
.jrtx{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.jrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.jrgrid p{margin:0}
.jrfl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.jrfl li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere}
@media (max-width:720px){.jrgrid{grid-template-columns:1fr}}
/* ===== diagnósticos: números do topo, filtros e tabela ===== */
.dgnums{margin-bottom:var(--gap)}
.dgn{display:block;text-align:left;color:var(--tx);cursor:pointer}
.dgn:hover{background:var(--card2)}
.dgn .l,.dgn .v{display:block}
.dgn .v{margin:8px 0 0}
.dgfil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dgfil input,.dgfil select{height:38px;max-width:100%;background:var(--in);border:1px solid var(--inb);border-radius:10px;padding:0 12px;font-size:14px}
.dgfil input{flex:1 1 220px;min-width:0}
.dgcont{margin:0 0 8px}
.dgpan{padding:0}
.dgtab td{vertical-align:top}
.dglink{display:inline-flex;align-items:flex-start;gap:6px;background:none;border:0;padding:0;text-align:left;font-weight:500;color:var(--tx);cursor:pointer;overflow-wrap:anywhere}
.dglink span{min-width:0}
.dglink:hover span{text-decoration:underline}
.dglink .chev{flex:none;color:var(--mu);margin-top:1px;transform:rotate(-90deg);transition:transform .2s}
.dglink[aria-expanded="true"] .chev{transform:none}
.dgtab td .by{margin-left:24px}
.dgtab tr.dgopen,.dgtab tr.dgdet{background:var(--card2)}
.dgtab tr.dgopen td{border-bottom-color:transparent}
.dgtab tr.dgdet,.dgtab tr.dgmes{cursor:default}
.dgtab tr.dgmes:hover{background:none}
.dgtab tr.dgmes th{padding-top:16px;font-size:13px;font-weight:600;color:var(--tx)}
.dgtab tr.dgmes th .muted{font-weight:400}
.dgdet>td{padding:4px 14px 16px 38px}
.dgdb{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 28px}
.dgdb .lab{font-size:12px;font-weight:500;color:var(--pri);margin-bottom:3px}
.dgdb p{margin:0;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.dgda{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:12px}
/* no celular a tabela rola para o lado: os detalhes ficam presos à esquerda e cabem na largura da tela */
@media (max-width:600px){.dgdb,.dgda{position:sticky;left:38px;max-width:calc(100vw - 100px)}.dgdb{grid-template-columns:1fr}}
.dgsm{font-size:13px;color:var(--mu);max-width:220px;overflow-wrap:anywhere}
.dgset{border:0;margin:0;padding:0;min-width:0}
.dgset legend{font-size:12px;color:var(--mu);padding:0;margin-bottom:6px}
.dgchks{display:flex;flex-wrap:wrap;gap:6px}
.dgchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--bg)}
.dgchk:has(input:checked){border-color:var(--pri);background:var(--card2)}
.dgchk input{margin:0;accent-color:var(--pri)}/* ===== tema claro (o escuro continua sendo o padrão) ===== */
:root[data-theme="light"]{
--bg:#F5F5F5;--card:#FFFFFF;--card2:#EFEFEF;--bd:#E0E0E0;--bd2:#C2C2C2;
--pri:#08875D;--pri-h:#067049;--on:#FFFFFF;--tx:#171717;--mu:#5C5C5C;--mu2:#666666;
--in:#FFFFFF;--inb:#D0D0D0;--ln:rgba(0,0,0,.06);
--ok:#18773A;--wa:#A35F00;--er:#C3362A;--ice:#16201B;color-scheme:light}
/* rótulos das chaves Ativo/Administrador: a regra .swl da apresentação usa texto quase branco */
[data-theme="light"] label.swl>span{color:var(--tx)}
/* cores das pessoas na agenda: contorno leve para os tons claros não sumirem no fundo claro */
[data-theme="light"] .agleg .dot,[data-theme="light"] .agd .pts .dot{box-shadow:inset 0 0 0 1px rgba(22,32,27,.3)}
[data-theme="light"] .top,[data-theme="light"] body::before{background:rgba(245,245,245,.94)}
/* no tema claro o verde da marca fica nos botões; textos e bordas usam o verde mais escuro (--pri), legível no branco */
[data-theme="light"] .btn.pri{background:#0FC589;border-color:#0FC589;color:#06261A}
[data-theme="light"] .btn.pri:hover{background:#12B07C;border-color:#12B07C}
[data-theme="light"] #ucard{box-shadow:0 18px 44px rgba(23,23,23,.14)}
[data-theme="light"] .nav button.on{color:var(--pri-h)}
[data-theme="light"] #wp{box-shadow:0 18px 44px rgba(22,32,27,.14)}
[data-theme="light"] .cc i{background:#C5D0CA}
[data-theme="light"] .toast.err{color:#2A0705}
[data-theme="light"] .btn.dang{color:#FFFFFF}
[data-theme="light"] .btn.dang:hover{background:#A82C22}
/* a apresentação tem visual próprio: mantém as cores originais e continua escura em qualquer tema (vale também para o HTML offline) */
#pres,[data-theme="light"] #pres{--bg:#131917;--card:#1F2824;--card2:#28332E;--bd:#34413B;--bd2:#4A5A52;--pri:#00CC1D;--pri-h:#19DD36;--on:#04150E;--tx:#EEF2EF;--mu:#93A099;--mu2:#82918A;--ok:#3DDC6A;--wa:#F5B94F;--er:#F2665A;--ice:#E8F4EA;color:var(--tx);color-scheme:dark}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE
   Cole aqui o objeto firebaseConfig do seu projeto (Configurações do

   sistema roda em modo demonstração, com os dados salvos só neste

const FIREBASE_CONFIG = null;
/* Domínio usado para transformar o usuário em e-mail no Firebase
   Authentication: o usuário "processos" vira processos@central-igreen.app */
const DOMINIO_LOGIN = 'central-igreen.app';
/* Usuário que vira administrador no primeiríssimo acesso */
const USUARIO_INICIAL = 'processos';
/* ===================================================================== */

(()=>{'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isN=v=>typeof v==='number'&&isFinite(v);
const nf=(n,d=0)=>isN(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=n=>isN(n)?nf(n,2)+'%':'—';
const dur=m=>{if(!isN(m))return '—';m=Math.round(m);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const parseDur=s=>{s=String(s??'').trim().toLowerCase();if(!s)return null;const m=s.match(/^(\d+)\s*[h:]\s*(\d{1,2})?$/);if(m)return +m[1]*60+(+m[2]||0);if(/^[\d.,]+$/.test(s)){const n=parseFloat(s.replace(',','.'));if(isFinite(n))return Math.round(n*60)}return NaN};
const parseNum=s=>{s=String(s??'').trim().replace('%','');if(s==='')return null;if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)};
const dfmt=s=>{if(!s)return '';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const dshort=s=>{if(!s)return '';const[,m,d]=s.split('-');return `${d}/${m}`};
const today=()=>ymd(new Date());
const tsTxt=t=>{if(!t)return '';const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)} às ${pad(d.getHours())}h${pad(d.getMinutes())}`};
const norm=s=>String(s||'').trim().toLowerCase();
const MESL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MSH=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const wkTxt=w=>{const a=pdate(w.inicio),b=pdate(w.fim);return a.getMonth()===b.getMonth()?`${a.getDate()} a ${b.getDate()} ${MSH[b.getMonth()]}`:`${a.getDate()} ${MSH[a.getMonth()]} a ${b.getDate()} ${MSH[b.getMonth()]}`};
const periodo=w=>w?`${dshort(w.inicio)} a ${dfmt(w.fim)}`:'';
const setPath=(o,p,v)=>{const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++){if(typeof c[k[i]]!=='object'||c[k[i]]===null)c[k[i]]={};c=c[k[i]]}if(v===undefined)delete c[k.at(-1)];else c[k.at(-1)]=v};
const emailOf=u=>`${norm(u)}@${DOMINIO_LOGIN}`;
const FR={q:'Qualidade',o:'Operações'};

const DEFAULTS={colaboradores:[],
 setores:[{id:'licenciado',nome:'Suporte ao licenciado'},{id:'cliente',nome:'Suporte ao cliente'},{id:'retencao',nome:'Retenção'},{id:'inadimplencia',nome:'Inadimplência'}],
 colabMigrado:true};
const emptyWeek=id=>({inicio:id,fim:addDays(id,4),fechada:false,q:{},o:{},planos:{},palavras:{},criadaEm:Date.now()});
const errMsg=e=>{const c=(e&&e.code)||'';if(/wrong-password|invalid-credential|user-not-found|invalid-login|invalid-email/.test(c))return 'Usuário ou senha incorretos.';if(/too-many-requests/.test(c))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';if(/network/.test(c))return 'Sem conexão com a internet. Verifique e tente de novo.';if(/permission-denied/.test(c))return 'Você não tem permissão para essa ação.';if(/email-already-in-use/.test(c))return 'Esse usuário já existe ou já existiu. Escolha outro nome, ou exclua a conta antiga em Authentication, no Console do Firebase.';if(/weak-password/.test(c))return 'A senha precisa ter pelo menos 6 caracteres.';if(/requires-recent-login/.test(c))return 'Por segurança, saia e entre de novo antes de trocar a senha.';return (e&&e.message)||'Algo deu errado. Tente de novo.'};

/* ---------------- banco: modo demonstração (navegador) ---------------- */
const LocalDB={
 mode:'local',key:'central-igreen-v2',sk:'central-igreen-sessao',cb:null,authCb:null,
 load(){let d;try{d=JSON.parse(localStorage.getItem(this.key))}catch(e){}if(!d){d={settings:null,weeks:{},users:[{id:'u'+uid(),nome:'Processos',usuario:USUARIO_INICIAL,senha:'processos2026',admin:true,criado:Date.now()}]};try{const old=JSON.parse(localStorage.getItem('central-igreen-demo'));if(old&&old.weeks){d.weeks=old.weeks;d.settings=old.settings}}catch(e){}this.save(d,true)}return d},
 save(d,quiet){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){toast('Não foi possível salvar neste navegador.',true)}if(!quiet)this.emit()},
 emit(){setTimeout(()=>{if(this.cb){const d=this.load();this.cb({settings:d.settings,weeks:d.weeks,users:d.users.map(({senha,...u})=>u)})}},0)},
 sess(){try{return sessionStorage.getItem(this.sk)||localStorage.getItem(this.sk)}catch(e){return null}},
 async init(){addEventListener('storage',e=>{if(e.key===this.key)this.emit()})},
 onAuth(cb){this.authCb=cb;const id=this.sess(),u=id&&this.load().users.find(x=>x.id===id);cb(u?{id:u.id}:null)},
 async login(usr,p,keep){const u=this.load().users.find(x=>x.usuario===norm(usr)&&x.senha===p);if(!u)throw new Error('Usuário ou senha incorretos.');try{(keep?localStorage:sessionStorage).setItem(this.sk,u.id)}catch(e){}this.authCb({id:u.id})},
 async logout(){try{sessionStorage.removeItem(this.sk);localStorage.removeItem(this.sk)}catch(e){}this.cb=null;this.authCb(null)},
 watch(cb){this.cb=cb;this.emit()},
 isAdm(){const u=this.load().users.find(x=>x.id===this.sess());return !!(u&&u.admin)},
 adm(){if(!this.isAdm())throw new Error('Só administradores podem fazer isso.')},
 async update(id,patch){const d=this.load(),w=d.weeks[id];if(!w)return;if(w.fechada&&!this.isAdm())throw new Error('Esta semana está fechada.');for(const[k,v]of Object.entries(patch))setPath(w,k,v);this.save(d)},
 async createWeek(id,data){const d=this.load();if(!d.weeks[id]){d.weeks[id]=data;this.save(d)}},
 async deleteWeek(id){this.adm();const d=this.load();delete d.weeks[id];this.save(d)},
 async saveSettings(s){this.adm();const d=this.load();d.settings=s;this.save(d)},
 async restore(b){this.adm();const d=this.load();if(b.settings)d.settings=b.settings;Object.assign(d.weeks,b.weeks||{});this.save(d)},
 async addUser({nome,usuario,senha,admin}){this.adm();const d=this.load();if(d.users.some(x=>x.usuario===usuario))throw new Error('Esse usuário já existe. Escolha outro.');d.users.push({id:'u'+uid(),nome,usuario,senha,admin,criado:Date.now()});this.save(d)},
 async updateUser(id,data){this.adm();const d=this.load(),u=d.users.find(x=>x.id===id);if(u){Object.assign(u,data);this.save(d)}},
 async setPassword(id,senha){const d=this.load(),u=d.users.find(x=>x.id===id);if(!u)return;if(id!==this.sess())this.adm();u.senha=senha;this.save(d)},
 async deleteUser(id){this.adm();const d=this.load();d.users=d.users.filter(x=>x.id!==id);this.save(d)},
 canSetOthersPassword:true
};

/* ---------------- banco: Firebase ---------------- */
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Não foi possível carregar '+src));document.head.appendChild(s)});
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
const FireDB={
 mode:'firebase',unsub:[],
 async init(){await loadScript(FB+'firebase-app-compat.js');await loadScript(FB+'firebase-auth-compat.js');await loadScript(FB+'firebase-firestore-compat.js');
  this.app=firebase.initializeApp(FIREBASE_CONFIG);this.auth=this.app.auth();this.db=this.app.firestore();
  this.aux=firebase.initializeApp(FIREBASE_CONFIG,'cadastro');this.auxAuth=this.aux.auth();await this.auxAuth.setPersistence(firebase.auth.Auth.Persistence.NONE)},
 onAuth(cb){this.auth.onAuthStateChanged(async u=>{if(!u){cb(null);return}
  try{const ref=this.db.doc('users/'+u.uid);let s=await ref.get();
   if(!s.exists&&u.email===emailOf(USUARIO_INICIAL)){const boot=await this.db.doc('config/boot').get();if(!boot.exists){const b=this.db.batch();b.set(ref,{nome:'Processos',usuario:USUARIO_INICIAL,admin:true,criado:Date.now()});b.set(this.db.doc('config/boot'),{em:Date.now(),por:u.uid});await b.commit();s=await ref.get()}}
   if(!s.exists){await this.auth.signOut();loginErr('Seu acesso a este sistema foi removido. Fale com um administrador.');return}
   cb({id:u.uid})}catch(e){await this.auth.signOut();loginErr(errMsg(e))}})},
 async login(usr,p,keep){await this.auth.setPersistence(firebase.auth.Auth.Persistence[keep?'LOCAL':'SESSION']);try{await this.auth.signInWithEmailAndPassword(emailOf(usr),p)}catch(e){throw new Error(errMsg(e))}},
 async logout(){this.unsub.forEach(f=>f());this.unsub=[];await this.auth.signOut()},
 watch(cb){const st={settings:null,weeks:{},users:[]};let ready=0;const go=()=>cb(clone(st)),r=()=>{ready++;if(ready>=3)go()};
  const fail=e=>{toast(errMsg(e),true);if(ready<3)r()};
  this.unsub.push(this.db.doc('config/settings').onSnapshot(s=>{st.settings=s.exists?s.data():null;ready<3?r():go()},fail));
  this.unsub.push(this.db.collection('weeks').onSnapshot(q=>{st.weeks={};q.forEach(d=>st.weeks[d.id]=d.data());ready<3?r():go()},fail));
  this.unsub.push(this.db.collection('users').onSnapshot(q=>{st.users=[];q.forEach(d=>st.users.push({id:d.id,...d.data()}));ready<3?r():go()},fail))},
 async update(id,patch){const o={};for(const[k,v]of Object.entries(patch))o[k]=v===undefined?firebase.firestore.FieldValue.delete():v;try{await this.db.collection('weeks').doc(id).update(o)}catch(e){throw new Error(errMsg(e))}},
 async createWeek(id,data){const ref=this.db.collection('weeks').doc(id);try{await this.db.runTransaction(async t=>{const s=await t.get(ref);if(!s.exists)t.set(ref,data)})}catch(e){throw new Error(errMsg(e))}},
 async deleteWeek(id){try{await this.db.collection('weeks').doc(id).delete()}catch(e){throw new Error(errMsg(e))}},
 async saveSettings(s){try{await this.db.doc('config/settings').set(s)}catch(e){throw new Error(errMsg(e))}},
 async restore(b){const ops=[];if(b.settings)ops.push(['config/settings',b.settings]);for(const[id,w]of Object.entries(b.weeks||{}))ops.push(['weeks/'+id,w]);
  try{for(let i=0;i<ops.length;i+=400){const bt=this.db.batch();ops.slice(i,i+400).forEach(([p,d])=>bt.set(this.db.doc(p),d));await bt.commit()}}catch(e){throw new Error(errMsg(e))}},
 async addUser({nome,usuario,senha,admin}){let cred;try{cred=await this.auxAuth.createUserWithEmailAndPassword(emailOf(usuario),senha)}catch(e){throw new Error(errMsg(e))}
  try{await this.db.doc('users/'+cred.user.uid).set({nome,usuario,admin,criado:Date.now()})}catch(e){throw new Error(errMsg(e))}finally{try{await this.auxAuth.signOut()}catch(e){}}},
 async updateUser(id,data){try{await this.db.doc('users/'+id).update(data)}catch(e){throw new Error(errMsg(e))}},
 async setPassword(id,senha,atual){const u=this.auth.currentUser;if(!u||u.uid!==id)throw new Error('No Firebase, cada pessoa troca a própria senha.');
  try{await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,atual||''))}catch(e){throw new Error('A senha atual está incorreta.')}
  try{await u.updatePassword(senha)}catch(e){throw new Error(errMsg(e))}},
 async deleteUser(id){try{await this.db.doc('users/'+id).delete()}catch(e){throw new Error(errMsg(e))}},
 canSetOthersPassword:false
};

/* Banco Neon via API segura */
const NeonDB={
 mode:'neon',cb:null,authCb:null,user:null,timer:null,canSetOthersPassword:true,
 async req(action,data={}){const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'Resposta inválida do servidor'}));if(!r.ok)throw new Error(j.error||'Erro ao acessar o servidor');return j},
 async init(){await this.req('health')},
 onAuth(cb){this.authCb=cb;this.req('me').then(r=>{this.user=r.user;cb(r.user?{id:r.user.id}:null)}).catch(()=>cb(null))},
 async login(usr,p,keep){const r=await this.req('login',{usuario:usr,senha:p,keep});this.user=r.user;this.authCb({id:r.user.id})},
 async logout(){clearInterval(this.timer);this.timer=null;await this.req('logout');this.user=null;this.cb=null;this.authCb(null)},
 watch(cb){this.cb=cb;this.refresh();clearInterval(this.timer);this.timer=setInterval(()=>{if(this.cb&&document.visibilityState==='visible')this.refresh()},10000)},
 async refresh(){try{const d=await this.req('snapshot');if(this.cb)this.cb(d)}catch(e){console.error(e);toast(e.message,true)}},
 isAdm(){return !!this.user?.admin},
 async mutate(action,data){await this.req(action,data);await this.refresh()},
 async update(id,patch){await this.mutate('update',{id,patch})},
 async createWeek(id,data){await this.mutate('createWeek',{id,data})},
 async deleteWeek(id){await this.mutate('deleteWeek',{id})},
 async saveSettings(s){await this.mutate('saveSettings',{settings:s})},
 async restore(b){await this.mutate('restore',{backup:b})},
 async addUser(user){await this.mutate('addUser',{user})},
 async updateUser(id,data){await this.mutate('updateUser',{id,data})},
 async setPassword(id,senha,atual){await this.mutate('setPassword',{id,senha,atual})},
 async deleteUser(id){await this.mutate('deleteUser',{id})},
 /* agenda: fora do snapshot; carregada só na tela da Agenda */
 async agendaList(p){return this.req('agendaList',p)},
 async agendaSave(p){return this.req('agendaSave',p)},
 async agendaDelete(id){return this.req('agendaDelete',{id})},
 async agendaPessoas(){return this.req('agendaPessoas')},
 /* áreas novas (Jornada…): só administradores; fora do snapshot, carregadas na própria tela */
 async regList(area,extra){return this.req('regList',{...(extra||{}),area})},
 async regSave(p){return this.req('regSave',p)},
 async regDelete(area,id){return this.req('regDelete',{area,id})},
 async regOrdem(area,ids){return this.req('regOrdem',{area,ids})}
};

const DB=NeonDB;

/* ---------------- estado ---------------- */
let S={settings:null,weeks:{},users:[]},meId=null,sel=null,page='inicio',chartSel={q:'qualidade',o:'trat'},wordEdit=false,pIdx=0,cfgView=null,booted=false,pickY=null,pickM=null,cfgYear=null,ED=null,openPl=new Set(),migrating=false;

/* conflito (409) ou registro apagado (404) fecham o painel; a lista é sempre lida de novo depois de gravar */
async function saveJr(btn){const ed=ED,{kind,id,x}=ed,etapa=kind==='jretapa',area=etapa?'jornada_etapa':'jornada_fluxo';
 const erro=(k,m)=>{const b=$('jr_'+k).closest('.f');b.classList.add('bad');b.querySelector('.msg').textContent=m;$('jr_'+k).focus()};
 let data;
 if(etapa){const v=k=>$('jr_'+k).value,nome=v('nome').trim();if(!nome)return erro('nome','Digite o nome da etapa.');

 jrCarregar();

 /* botão travado durante a exclusão: evita o aviso de "não existe mais" num segundo clique */

/* sobe ou desce uma etapa; um movimento por vez, com a lista inteira na nova ordem */

 const i=E.findIndex(x=>x.id===id),k=i+dir;if(i<0||k<0||k>=E.length)return;

 catch(e){toast(/mudou/.test(e.message)?'A lista mudou em outra aba ou por outra pessoa. A tela foi atualizada.':e.message,true)}

 /* devolve o foco à seta usada, para quem usa o teclado */

 /* problema listado na etapa: abre Diagnósticos sem filtros, com esse problema já aberto */
 else if(d.jrdiag){const id=d.jrdiag;Object.assign(DG.f,{q:'',mes:'',sit:'',grav:'',etapa:'',setor:''});DG.abertos.add(id);page='an-diag';closeMenu();closeEd();render();
  const b=document.querySelector(`[data-dgtog="${CSS.escape(id)}"]`);if(b){b.focus({preventScroll:true});b.closest('tr').scrollIntoView({block:'center'})}else scrollTo({top:0})}
 else if('jrrecarregar' in d){JR=jrVazio(null);render.cfgShown=null;render()}
 else if(d.jretapa!==undefined)openJrEtapa(d.jretapa||null);
 else if(d.jrfluxo!==undefined)openJrFluxo(d.jrfluxo||null);
 else if(d.jrmover)moverJr(d.jrmover,+d.jrdir);
 else if('jrsalvar' in d)saveJr(t);

});

/* ---------- diagnósticos ----------
   problemas da experiência; só administradores. As etapas vêm da Jornada; os setores são etiquetas digitadas
   (as mesmas sugestões da Jornada). Uma etapa excluída continua guardada no problema e aparece como "Etapa excluída" */
const DG_GRAV={critica:['Crítica','er',4],alta:['Alta','wa',3],media:['Média','',2],baixa:['Baixa','ln',1]};
const DG_SIT={ativo:['Ativo','er'],investigacao:['Em investigação','wa'],reduzido:['Reduzido','ln'],resolvido:['Resolvido','ok']};
const DG_FREQ={diaria:'Diária',semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal',pontual:'Pontual',nao_medida:'Não medida'};

/* f.mes: 'AAAA-MM' (abre no mês atual) ou '' para todos os meses; abertos: problemas com os detalhes à mostra */
const dgVazio=dono=>({itens:null,limitado:false,dono,carregando:false,denovo:false,erro:false,html:null,adiado:false,abertos:new Set(),f:{q:'',mes:today().slice(0,7),sit:'ativos',grav:'',etapa:'',setor:''}});
let DG=dgVazio(null);
/* mês do problema: o da data de registro; sem ela, o mês em que foi criado no sistema */
const dgMes=x=>/^\d{4}-\d{2}/.test(x.data.data||'')?x.data.data.slice(0,7):ymd(new Date(x.criado)).slice(0,7);
const dgMesNome=k=>`${MESL[+k.slice(5,7)-1]} de ${k.slice(0,4)}`;
const dgM=(M,k)=>Object.hasOwn(M,k)?M[k]:null;
const dgAtivo=x=>x.data.situacao==='ativo'||x.data.situacao==='investigacao';
const dgChip=(M,k)=>{const v=dgM(M,k);return v?`<span class="chip ${v[1]}">${esc(v[0])}</span>`:''};
/* nomes das etapas só depois de a Jornada carregar (antes disso, não dá para saber se foi excluída) */
const dgEtapas=x=>JR.etapas?[...new Set(x.data.etapas.map(jrNome))].join(', '):x.data.etapas.length?(JR.erro?'Não carregadas':'…'):'';
const dgRedesenhar=()=>{if(page==='an-diag'||page==='an-jornada'||page==='an-perg'||page==='an-setor'||page==='pm-proj'||page==='pm-fut')render()};
async function dgCarregar(){
 if(!isAdmin())return;
 if(DG.dono!==meId)DG=dgVazio(meId);
 const j=DG;if(j.carregando){j.denovo=true;return}j.carregando=true;
 try{const r=await DB.regList('diagnostico');if(j!==DG)return;
  const itens=r.itens||[],mudou=JSON.stringify(j.itens)!==JSON.stringify(itens);
  Object.assign(j,{itens,limitado:!!r.limitado,erro:false});if(mudou)dgRedesenhar();
 }catch(e){if(j===DG&&!j.itens){j.erro=true;dgRedesenhar()}}
 finally{j.carregando=false;if(j.denovo&&j===DG){j.denovo=false;dgCarregar()}}
}
function dgLista(){const f=DG.f,q=f.q.trim().toLowerCase(),st=f.setor.toLowerCase(),peso=x=>(dgM(DG_GRAV,x.data.gravidade)||[0,0,0])[2];
 return DG.itens.filter(x=>{const d=x.data;
  if(f.mes&&dgMes(x)!==f.mes)return false;
  if(f.sit==='ativos'&&!dgAtivo(x))return false;
  if(f.sit==='fechados'&&d.situacao!=='resolvido'&&d.situacao!=='reduzido')return false;
  if(Object.hasOwn(DG_SIT,f.sit)&&d.situacao!==f.sit)return false;
  if(f.grav&&d.gravidade!==f.grav)return false;
  if(f.etapa&&!d.etapas.includes(f.etapa))return false;
  if(st&&!d.setores.some(s=>s.toLowerCase()===st))return false;
  return !q||[d.titulo,d.descricao,d.causa,d.tema,d.impacto,d.evidencias,d.proxima].join(' ').toLowerCase().includes(q)})
 /* mais graves primeiro; depois os registrados mais recentemente */
 .sort((a,b)=>peso(b)-peso(a)||(b.data.data||'').localeCompare(a.data.data||'')||b.criado-a.criado)}
function dgResultado(){
 if(!DG.itens.length)return `<div class="panel embreve"><p class="muted">Nenhum problema registrado ainda. Registre o que está acontecendo, onde acontece na jornada e qual o impacto para o cliente.</p><button class="btn pri" data-dgabrir="">${ICO.plus}Registrar problema</button></div>`;
 const R=dgLista();if(!R.length)return '<div class="panel"><p class="muted">Nenhum problema com esses filtros.</p></div>';

 /* detalhes completos, abertos e fechados pela própria linha; editar continua no painel lateral */

 <div class="dgda"><span class="muted">Registrado em ${tsTxt(x.criado)}${x.atualizado!==x.criado?` · alterado em ${tsTxt(x.atualizado)}`:''}</span><button class="btn sm" data-dgabrir="${esc(x.id)}">${ICO.edit}Editar</button></div></td></tr>`};
 const linha=x=>{const d=x.data,ab=DG.abertos.has(x.id);return `<tr data-dgrow="${esc(x.id)}"${ab?' class="dgopen"':''}><td><button class="dglink" data-dgtog="${esc(x.id)}" aria-expanded="${ab}"${ab?` aria-controls="dgd_${esc(x.id)}"`:''}>${ICO.chev}<span>${esc(d.titulo)}</span></button>${d.tema?`<span class="by">Tema: ${esc(d.tema)}</span>`:''}</td><td>${dgChip(DG_GRAV,d.gravidade)}</td><td class="dgsm">${esc(dgM(DG_FREQ,d.frequencia)||'—')}</td><td class="dgsm">${esc(dgEtapas(x)||'—')}</td><td class="dgsm">${esc(d.setores.join(', ')||'—')}</td><td class="dgsm">${causa(d)}</td><td>${dgChip(DG_SIT,d.situacao)}</td></tr>${ab?detalhes(x):''}`};
 /* em "Todos os meses", agrupa por mês (mais recente primeiro), mantendo a ordem por gravidade dentro de cada mês */
 let corpo;if(DG.f.mes)corpo=R.map(linha).join('');
 else{const G=new Map();R.forEach(x=>{const k=dgMes(x);G.has(k)?G.get(k).push(x):G.set(k,[x])});
  corpo=[...G.keys()].sort().reverse().map(k=>{const g=G.get(k);return `<tr class="dgmes"><th colspan="7" scope="rowgroup">${esc(dgMesNome(k))} <span class="muted">· ${g.length} ${g.length===1?'problema':'problemas'}</span></th></tr>${g.map(linha).join('')}`}).join('')}
 return `<p class="muted dgcont">${R.length} ${R.length===1?'problema':'problemas'}</p><div class="panel dgpan"><div class="tw"><table class="dgtab"><thead><tr><th>Problema</th><th>Gravidade</th><th>Frequência</th><th>Etapas</th><th>Setores</th><th>Causa</th><th>Situação</th></tr></thead><tbody>${corpo}</tbody></table></div></div>`}
function dgFiltros(){const f=DG.f,o=(v,t,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`;
 const setores=[...new Map(DG.itens.flatMap(x=>x.data.setores).map(s=>[s.toLowerCase(),s])).values()].sort((a,b)=>a.localeCompare(b));
 /* filtro de uma etapa ou setor que deixou de existir não pode continuar valendo escondido */

 <select id="dg_grav" aria-label="Gravidade">${o('','Todas as gravidades',f.grav)}${Object.entries(DG_GRAV).map(([k,[t]])=>o(k,t,f.grav)).join('')}</select>
 <select id="dg_etapa" aria-label="Etapa da jornada">${o('','Todas as etapas',f.etapa)}${(JR.etapas||[]).map((e,i)=>o(e.id,`${i+1}. ${e.data.nome}`,f.etapa)).join('')}</select>

async function saveDiag(btn){const ed=ED,{id,x}=ed,v=k=>$('dg_'+k).value;
 const erro=(k,m)=>{const b=$('dg_'+k).closest('.f');b.classList.add('bad');b.querySelector('.msg').textContent=m;$('dg_'+k).focus()};
 const titulo=v('titulo').trim();if(!titulo)return erro('titulo','Digite o título do problema.');
 if(!jrAddSetor())return $('jr_setor').focus();
 /* etapas que não viraram caixa na tela (excluídas ou ainda não carregadas) continuam guardadas no problema */
 const marc=[...$('ed').querySelectorAll('.dgchks input:checked')].map(i=>i.value),fora=x.data.etapas.filter(e=>!ED.mostradas.has(e));
 const data={titulo,descricao:v('descricao'),etapas:[...new Set([...marc,...fora])],setores:ED.setores.slice(),tema:v('tema').trim(),data:v('data'),impacto:v('impacto'),
  frequencia:v('frequencia'),gravidade:v('gravidade'),causaTipo:v('causaTipo'),causa:v('causa'),evidencias:v('evidencias'),proxima:v('proxima'),situacao:v('situacao')};
 const lbl=btn.innerHTML;btn.textContent='Salvando…';btn.setAttribute('aria-disabled','true');
 try{await DB.regSave(id?{area:'diagnostico',id,versao:x.atualizado,data}:{area:'diagnostico',data});if(ED===ed)closeEd();toast(id?'Problema salvo':'Problema registrado')}
 catch(e){btn.innerHTML=lbl;btn.removeAttribute('aria-disabled');const c=agConflito(e);toast(c||e.message,true);if(c&&ED===ed)closeEd()}
 dgCarregar();
}
async function delDiag(btn){const ed=ED,{id,x}=ed;
 if(!await confirmBox('Excluir problema?',`O problema "${x.data.titulo}" será excluído. Isso não pode ser desfeito.`,'Excluir problema',true))return;
 btn.setAttribute('aria-disabled','true');
 try{await DB.regDelete('diagnostico',id);if(ED===ed)closeEd();toast('Problema excluído')}
 catch(e){btn.removeAttribute('aria-disabled');const c=agConflito(e);toast(c||e.message,true);if(c&&ED===ed)closeEd()}
 dgCarregar();
}

const DG_ATALHO=Object.fromEntries(Object.entries({ativos:['ativos',''],criticos:['ativos','critica'],investigacao:['investigacao',''],fechados:['fechados','']}).map(([k,[sit,grav]])=>[k,{q:'',mes:'',sit,grav,etapa:'',setor:''}]));
/* abre ou fecha os detalhes de um problema, devolvendo o foco ao botão da linha */
const dgToggle=id=>{DG.abertos.has(id)?DG.abertos.delete(id):DG.abertos.add(id);dgAtualizar();const b=document.querySelector(`[data-dgtog="${CSS.escape(id)}"]`);b&&b.focus()};
document.addEventListener('click',e=>{
 const tr=e.target.closest&&e.target.closest('tr[data-dgrow]');if(tr&&!e.target.closest('button')){if(!getSelection().toString())dgToggle(tr.dataset.dgrow);return}
 const t=e.target.closest&&e.target.closest('button');if(!t||t.getAttribute('aria-disabled')==='true')return;const d=t.dataset;
 if(d.dgtog)dgToggle(d.dgtog);
 else if(d.dgabrir!==undefined)openDiag(d.dgabrir||null);
 else if(d.dgfiltro&&Object.hasOwn(DG_ATALHO,d.dgfiltro)){Object.assign(DG.f,DG_ATALHO[d.dgfiltro]);rDiag();const b=document.querySelector(`[data-dgfiltro="${d.dgfiltro}"]`);b&&b.focus()}
 else if('dgrecarregar' in d){DG=dgVazio(null);render()}
 else if('dgsalvar' in d)saveDiag(t);
 else if('dgexcluir' in d)delDiag(t);
});

/* ---------- projetos e iniciativas / planejamento futuro ----------
   só administradores. Setores são etiquetas digitadas (as mesmas sugestões da Jornada e dos Diagnósticos);
   etapas e problemas são ids da Jornada e dos Diagnósticos (um excluído depois continua guardado e aparece como excluído).
   Toda mudança de status entra sozinha no histórico do projeto */
const PJ_ST={ideia:['Ideia','ln'],planejado:['Planejado',''],andamento:['Em andamento','in'],standby:['Em stand-by','wa'],aguardando:['Aguardando dependência','wa'],concluido:['Concluído','ok'],cancelado:['Cancelado','ln']};
const PJ_VAL={nao_avaliado:'Não avaliado',aguardando:'Aguardando medição',comprovada:'Melhoria comprovada',parcial:'Melhoria parcial',sem_efeito:'Sem efeito',piorou:'Piorou'};
const PJ_HT={atualizacao:['Atualização','in'],decisao:['Decisão',''],marco:['Etapa concluída','ok'],status:['Mudança de status','ln']};
const PJ_FUT=['ideia','planejado','standby','aguardando'];
const pjVazio=dono=>({itens:null,hist:null,limitado:false,dono,carregando:false,denovo:false,erro:false,html:null,fhtml:null,adiado:false,vista:'quadro',movendo:new Set(),f:{q:'',mes:today().slice(0,7),status:'',prio:'',setor:'',resp:''}});
let PJ=pjVazio(null);
const pjAberto=x=>x.data.status!=='concluido'&&x.data.status!=='cancelado';
const pjAtrasado=x=>pjAberto(x)&&!!x.data.prazo&&x.data.prazo<today();
/* mês (AAAA-MM): o que estava na mesa naquele mês — criado até o fim do mês e, se já encerrado, encerrado nele ou depois.
   No mês atual: todos os em aberto e os concluídos ou cancelados neste mês. Cancelado não tem data própria: vale a da última alteração */
const pjCriadoMes=x=>ymd(new Date(x.criado)).slice(0,7);
const pjNoMes=(x,m)=>{if(pjCriadoMes(x)>m)return false;if(pjAberto(x))return true;
 const fim=x.data.status==='concluido'&&x.data.concluidoEm?x.data.concluidoEm:ymd(new Date(x.atualizado));return fim.slice(0,7)>=m};
const pjPeso=x=>(dgM(DG_GRAV,x.data.prioridade)||[0,0,0])[2];
const pjHist=id=>(PJ.hist||[]).filter(h=>h.data.projeto===id).sort((a,b)=>b.data.dia.localeCompare(a.data.dia)||b.criado-a.criado);
const pjProbNome=id=>{const x=(DG.itens||[]).find(y=>y.id===id);return x?x.data.titulo:DG.itens?'Problema excluído':'…'};
const pjDoProblema=id=>(PJ.itens||[]).filter(x=>x.data.status!=='cancelado'&&x.data.problemas.includes(id));
const pjRedesenhar=()=>{if(page==='pm-proj'||page==='pm-fut'||page==='an-diag'||page==='an-perg'||page==='an-setor')render();
 /* o painel aberto não é redesenhado (perderia o que está sendo digitado): só a lista do histórico */
 if(ED&&ED.kind==='proj'&&ED.id&&$('pj_hist'))$('pj_hist').innerHTML=pjHistHtml(ED.id)};
async function pjCarregar(){
 if(!isAdmin())return;
 if(PJ.dono!==meId)PJ=pjVazio(meId);
 const j=PJ;if(j.carregando){j.denovo=true;return}j.carregando=true;
 try{const[p,h]=await Promise.all([DB.regList('projeto'),DB.regList('projeto_hist')]);if(j!==PJ)return;
  const novo={itens:p.itens||[],hist:h.itens||[]},mudou=JSON.stringify([j.itens,j.hist])!==JSON.stringify([novo.itens,novo.hist]);
  Object.assign(j,novo,{limitado:!!(p.limitado||h.limitado),erro:false});if(mudou)pjRedesenhar();
 }catch(e){if(j===PJ&&!j.itens){j.erro=true;pjRedesenhar()}}
 finally{j.carregando=false;if(j.denovo&&j===PJ){j.denovo=false;pjCarregar()}}
}
const pjCarregarTudo=()=>{if(PJ.dono!==meId)pjCarregar();if(JR.dono!==meId)jrCarregar();if(DG.dono!==meId)dgCarregar()};
const pjEstado=()=>PJ.erro?`<div class="panel cfgp"><p class="muted">Não foi possível carregar os projetos.</p><div><button class="btn sm" data-pjrecarregar>Tentar de novo</button></div></div>`:'<div class="panel"><p class="muted" role="status">Carregando…</p></div>';
const pjAviso=()=>PJ.limitado?'<div class="banner"><span class="dot wa"></span><div>Há muitos registros: parte deles não está sendo exibida.</div></div>':'';
function pjLista(){const f=PJ.f,q=f.q.trim().toLowerCase(),st=f.setor.toLowerCase(),rp=f.resp.toLowerCase();
 return PJ.itens.filter(x=>{const d=x.data;
  if(f.mes&&!pjNoMes(x,f.mes))return false;
  if(f.status==='abertos'&&!pjAberto(x))return false;
  if(f.status==='parados'&&d.status!=='standby'&&d.status!=='aguardando')return false;
  if(f.status==='atrasados'&&!pjAtrasado(x))return false;
  if(Object.hasOwn(PJ_ST,f.status)&&d.status!==f.status)return false;
  if(f.prio&&d.prioridade!==f.prio)return false;
  if(st&&!d.setores.some(s=>s.toLowerCase()===st))return false;
  if(rp&&d.responsavel.toLowerCase()!==rp)return false;
  return !q||[d.nome,d.objetivo,d.acao,d.proxima,d.responsavel,d.impedimentos,d.dependeDe].join(' ').toLowerCase().includes(q)})
 /* mais importantes primeiro; depois o prazo mais próximo */
 .sort((a,b)=>pjPeso(b)-pjPeso(a)||(a.data.prazo||'9999').localeCompare(b.data.prazo||'9999')||a.criado-b.criado)}
const pjPrazo=x=>x.data.prazo?`<span class="chip ${pjAtrasado(x)?'er':'ln'}">${pjAtrasado(x)?'Atrasado · ':'Prazo '}${esc(dshort(x.data.prazo))}</span>`:'';
function pjCartao(x){const d=x.data,mv=PJ.movendo.has(x.id),S_=d.setores;
 return `<div class="panel agc pjc" data-pjabrir="${esc(x.id)}"${mv?' aria-busy="true"':` draggable="true" data-pjcard="${esc(x.id)}"`} tabindex="0" role="button" aria-label="Abrir projeto ${esc(d.nome)}">
  <div class="agch">${dgChip(DG_GRAV,d.prioridade)}${pjPrazo(x)}</div><h3>${esc(d.nome)}</h3>
  ${d.proxima?`<p>Próxima ação: ${esc(d.proxima)}</p>`:''}
  <small class="muted">${esc(d.responsavel||'Sem responsável')}${S_.length?` · ${esc(S_.slice(0,2).join(', '))}${S_.length>2?` +${S_.length-2}`:''}`:''}</small></div>`}
function pjResultado(){
 if(!PJ.itens.length)return `<div class="panel embreve"><p class="muted">Nenhum projeto cadastrado ainda. Registre as iniciativas, quem cuida de cada uma, os prazos e os problemas que elas resolvem.</p><button class="btn pri" data-pjnovo="">${ICO.plus}Novo projeto</button></div>`;
 const R=pjLista();
 const cont=`<p class="muted dgcont">${R.length} de ${PJ.itens.length} ${PJ.itens.length===1?'projeto':'projetos'}</p>`;
 if(PJ.vista==='quadro'){
  /* com um status escolhido no filtro, mostra só essa coluna */
  const cols=Object.hasOwn(PJ_ST,PJ.f.status)?[PJ.f.status]:Object.keys(PJ_ST);
  return cont+`<div class="pjquadro">${cols.map(k=>{const L=R.filter(x=>x.data.status===k);return `<section class="agcol" data-pjcol="${k}" aria-label="${esc(PJ_ST[k][0])}"><h2>${esc(PJ_ST[k][0])} <span class="muted">${L.length}</span></h2>${L.map(pjCartao).join('')||'<p class="muted pjvazio">Nenhum projeto.</p>'}</section>`}).join('')}</div>`}
 if(!R.length)return cont+'<div class="panel"><p class="muted">Nenhum projeto com esses filtros.</p></div>';
 return cont+`<div class="panel dgpan"><div class="tw"><table class="dgtab"><thead><tr><th>Projeto</th><th>Status</th><th>Prioridade</th><th>Responsável</th><th>Setores</th><th>Prazo</th><th>Próxima ação</th></tr></thead><tbody>${R.map(x=>{const d=x.data;
  return `<tr data-pjrow="${esc(x.id)}"><td><button class="dglink" data-pjabrir="${esc(x.id)}"><span>${esc(d.nome)}</span></button></td><td>${dgChip(PJ_ST,d.status)}</td><td>${dgChip(DG_GRAV,d.prioridade)}</td><td class="dgsm">${esc(d.responsavel||'—')}</td><td class="dgsm">${esc(d.setores.join(', ')||'—')}</td><td>${pjPrazo(x)||'—'}</td><td class="dgsm">${esc(d.proxima||'—')}</td></tr>`}).join('')}</tbody></table></div></div>`}
function pjFiltros(){const f=PJ.f,o=(v,t,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`;
 const unicos=L=>[...new Map(L.filter(Boolean).map(s=>[s.toLowerCase(),s])).values()].sort((a,b)=>a.localeCompare(b));
 const setores=unicos(PJ.itens.flatMap(x=>x.data.setores)),resp=unicos(PJ.itens.map(x=>x.data.responsavel));
 /* filtro de um setor ou responsável que deixou de existir não pode continuar valendo escondido */
 if(f.setor&&!setores.some(s=>s.toLowerCase()===f.setor.toLowerCase()))f.setor='';
 if(f.resp&&!resp.some(s=>s.toLowerCase()===f.resp.toLowerCase()))f.resp='';
 /* todos os meses desde o primeiro projeto até hoje, mais o escolhido (o filtro nunca fica valendo escondido) */
 const hoje=today().slice(0,7),meses=new Set([hoje,...(f.mes?[f.mes]:[])]);let m=PJ.itens.reduce((a,x)=>{const c=pjCriadoMes(x);return c<a?c:a},hoje);
 for(let i=0;m<hoje&&i<240;i++){meses.add(m);const[y,mm]=m.split('-').map(Number);m=mm===12?`${y+1}-01`:`${y}-${String(mm+1).padStart(2,'0')}`}
 return `<div class="dgfil"><input id="pjf_q" type="search" maxlength="100" placeholder="Buscar projeto, ação, responsável…" aria-label="Buscar projeto" value="${esc(f.q)}" autocomplete="off">
 <select id="pjf_mes" aria-label="Mês">${[...meses].sort().reverse().map(k=>o(k,dgMesNome(k),f.mes)).join('')}${o('','Todos os meses',f.mes)}</select>
 <select id="pjf_status" aria-label="Status">${o('','Todos os status',f.status)}${o('abertos','Em aberto (sem concluídos e cancelados)',f.status)}${o('parados','Parados (stand-by ou aguardando)',f.status)}${o('atrasados','Atrasados',f.status)}${Object.entries(PJ_ST).map(([k,[t]])=>o(k,t,f.status)).join('')}</select>
 <select id="pjf_prio" aria-label="Prioridade">${o('','Todas as prioridades',f.prio)}${Object.entries(DG_GRAV).map(([k,[t]])=>o(k,t,f.prio)).join('')}</select>
 <select id="pjf_setor" aria-label="Setor">${o('','Todos os setores',f.setor)}${setores.map(s=>o(s,s,f.setor)).join('')}</select>
 <select id="pjf_resp" aria-label="Responsável">${o('','Todos os responsáveis',f.resp)}${resp.map(s=>o(s,s,f.resp)).join('')}</select></div>
 <div class="pjbar"><div class="pjvis" role="group" aria-label="Forma de ver">${[['quadro','Quadro'],['tabela','Tabela']].map(([k,t])=>`<button class="${PJ.vista===k?'on':''}" data-pjvista="${k}" aria-pressed="${PJ.vista===k}">${t}</button>`).join('')}</div></div>`}

 const L=PJ.itens;let h;

 else{const A=L.filter(pjAberto),n=(t,v,f,c)=>`<button class="kpi dgn" data-pjfiltro="${f}"><span class="l">${t}</span><span class="v${c&&v?' '+c:''}">${v}</span></button>`;

 const html=`<header class="phead"><div><p class="kick">Projetos e Melhorias</p><h1>Projetos e Iniciativas</h1><p class="sub">As iniciativas para melhorar a experiência do cliente: quem cuida, prazos, o que depende de quem e o resultado alcançado. Arraste um cartão para mudar o status.</p></div><div class="tools"><button class="btn pri" data-pjnovo="">${ICO.plus}Novo projeto</button></div></header>${h}`;

  const bloco=(t,L_,destaque)=>`<section class="pjfb${destaque?' venc':''}"><h2>${t} <span class="muted">${L_.length}</span></h2><div class="pjgrade">${L_.map(card).join('')}</div></section>`;

/* ---------- monitorias: tela de todos os usuários ----------
   setores → cards dos agentes do setor (média e nº de monitorias do mês) → nova monitoria e histórico do agente por semana.
   As monitorias são buscadas por mês; a nota é calculada pelo servidor (aqui só a prévia) */
const MO={setor:null,hist:null,mes:today().slice(0,7),itens:null,mesLido:null,dono:null,carregando:false,denovo:false,erro:false,limitado:false,html:null};
const moDatas=m=>{const[y,mm]=m.split('-').map(Number);return [m+'-01',ymd(new Date(y,mm,0))]};
const moMesSoma=(m,n)=>{const[y,mm]=m.split('-').map(Number),d=new Date(y,mm-1+n,1);return ymd(d).slice(0,7)};
async function moCarregar(){
 if(!meId)return;
 if(MO.dono!==meId)Object.assign(MO,{dono:meId,itens:null,mesLido:null,erro:false,limitado:false,denovo:false,setor:null,hist:null,html:null,mes:today().slice(0,7)});
 const mes=MO.mes;if(MO.carregando){MO.denovo=true;return}MO.carregando=true;const dono=MO.dono;
 try{const de=moDatas(mes)[0],ate=moDatas(moMesSoma(mes,1))[1],r=await DB.regList('monitoria',{de,ate});if(MO.dono!==dono||MO.mes!==mes)return;
  const novo=r.itens||[],mudou=MO.mesLido!==mes||JSON.stringify(MO.itens)!==JSON.stringify(novo);
  Object.assign(MO,{itens:novo,mesLido:mes,limitado:!!r.limitado,erro:false});if(mudou&&page==='monitorias')render();
 }catch(e){if(MO.dono===dono&&MO.mes===mes&&MO.mesLido!==mes){MO.erro=true;if(page==='monitorias')render()}}
 finally{MO.carregando=false;if(MO.denovo){MO.denovo=false;moCarregar()}}
}

const moMesRef=x=>x.data.vaga?x.data.vaga.mes:x.data.data.slice(0,7);

const moErro=(e,ed)=>{const m=String(e&&e.message||''),conf=/alterado por outra pessoa/i.test(m)||m==='Registro não encontrado.';toast(conf?(agConflito(e)||m):m,true);if(conf&&ED===ed)closeEd();else monCarregar();return conf};

const XL={verde:'FF176B45',escuro:'FF0A3125',marinho:'FF1F3864',gelo:'FFE8F4EA',zebra:'FFF4F8F5',borda:'FFD0D7D3',total:'FFFFF2CC',erro:'FFFCE4E4',apagado:'FF8C8C8C',branco:'FFFFFFFF'};
/* uma aba: faixa verde de título, subtítulo, bloco de informações (opcional), cabeçalho azul com filtro e linhas zebradas; cor(linha) devolve 'total', 'erro' ou 'apagado' */
function xlAba(wb,nome,{titulo,sub,info=[],cab,linhas,cor}){
 const ws=wb.addWorksheet(nome,{properties:{tabColor:{argb:XL.verde}}}),n=Math.max(cab.length,2),fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}}),b={style:'thin',color:{argb:XL.borda}},bordas={top:b,left:b,bottom:b,right:b};
 const faixa=(txt,f,fonte,alt)=>{const r=ws.addRow([txt]);ws.mergeCells(r.number,1,r.number,n);r.height=alt;const c=r.getCell(1);c.fill=fill(f);c.font=fonte;c.alignment={vertical:'middle',horizontal:'left',indent:1}};
 faixa(titulo,XL.verde,{bold:true,size:14,color:{argb:XL.branco}},28);
 faixa(sub||'',XL.gelo,{italic:true,size:10,color:{argb:XL.escuro}},18);
 ws.addRow([]);
 info.forEach(([k,v])=>{const r=ws.addRow([k,v]),c=r.getCell(1);c.font={bold:true,color:{argb:XL.escuro}};c.fill=fill(XL.gelo);r.getCell(1).border=r.getCell(2).border=bordas;r.getCell(2).alignment={horizontal:'left'}});
 if(info.length)ws.addRow([]);
 const h=ws.addRow(cab);h.height=30;h.eachCell(c=>{c.fill=fill(XL.marinho);c.font={bold:true,color:{argb:XL.branco}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=bordas});
 linhas.forEach((l,i)=>{const r=ws.addRow(l),t=cor&&cor(l);for(let j=1;j<=cab.length;j++){const c=r.getCell(j);c.border=bordas;c.alignment={vertical:'top',wrapText:true,horizontal:typeof l[j-1]==='number'?'center':'left'};
  c.fill=fill(t==='total'?XL.total:t==='erro'?XL.erro:i%2?XL.zebra:XL.branco);if(t==='total')c.font={bold:true};else if(t==='apagado')c.font={italic:true,color:{argb:XL.apagado}}}});
 /* largura de cada coluna pelo conteúdo, entre 10 e 50 caracteres (o texto maior quebra linha) */
 cab.forEach((t,j)=>{const m=[...linhas,...(j<2?info:[])].reduce((a,l)=>Math.max(a,String(l[j]??'').length),String(t).length);ws.getColumn(j+1).width=Math.min(50,Math.max(10,m+2))});
 ws.views=[{state:'frozen',ySplit:h.number,showGridLines:false}];
 ws.autoFilter={from:{row:h.number,column:1},to:{row:h.number,column:cab.length}};
 return ws}

/* ---------- calibragem preenchida pelas monitorias ----------
   para cada setor e semana (segunda a domingo), as monitorias registradas viram: monitorias, qualidade (média das notas, zeradas
   valendo 0), zeradas, agentes diferentes e responsáveis (todos os avaliadores). Nada é gravado na semana: o que for digitado à mão
   vale no lugar do automático; o automático só preenche os campos vazios. As monitorias são lidas por mês e guardadas aqui */
const MA={dono:null,meses:{},memo:new Map()};
const MA_CAMPOS=['monitorias','qualidade','zeradas','agentes'];
const maMesesDe=ids=>[...new Set(ids.flatMap(id=>[id.slice(0,7),addDays(id,6).slice(0,7)]))];
const maMudou=()=>{MA.memo.clear();render()};
function maCarregarMes(m){if(!meId)return Promise.resolve();if(MA.dono!==meId){MA.dono=meId;MA.meses={}}
 const e=MA.meses[m]||(MA.meses[m]={itens:null,prom:null,erro:0});if(e.prom)return e.prom;const dono=MA.dono;
 e.prom=(async()=>{try{const[de,ate]=moDatas(m),r=await DB.regList('monitoria',{de,ate});if(MA.dono!==dono||MA.meses[m]!==e)return;
  const novo=r.itens||[],mudou=JSON.stringify(e.itens)!==JSON.stringify(novo);e.itens=novo;e.erro=0;if(mudou)maMudou()}catch(err){if(MA.meses[m]===e)e.erro=Date.now()}finally{e.prom=null}})();
 return e.prom}
const maPronto=ids=>MA.dono===meId&&maMesesDe(ids).every(m=>MA.meses[m]&&MA.meses[m].itens);
/* espera os meses das semanas; devolve false se algum não carregou (quem chama avisa) */
const maGarantir=async L=>{const ids=L.filter(Boolean).map(w=>w.inicio);await Promise.all(maMesesDe(ids).map(maCarregarMes));return maPronto(ids)};
/* esquece o que foi lido (depois de registrar, corrigir ou excluir uma monitoria) */
const maLimpar=()=>{MA.meses={};MA.memo.clear()};
function maAuto(w,setor){if(!w||!w.inicio||!meId)return null;
 if(!maPronto([w.inicio])){maMesesDe([w.inicio]).forEach(m=>{const e=MA.dono===meId&&MA.meses[m];if(!e||(!e.itens&&!e.prom&&Date.now()-(e.erro||0)>30000))maCarregarMes(m)});return null}
 const mk=w.inicio+'|'+setor;if(MA.memo.has(mk))return MA.memo.get(mk);
 const fim=addDays(w.inicio,6),L=maMesesDe([w.inicio]).flatMap(m=>MA.meses[m].itens).filter(x=>x.data.setor===setor&&x.data.data>=w.inicio&&x.data.data<=fim);
 if(!L.length){MA.memo.set(mk,null);return null}
 const res={monitorias:L.length,qualidade:Math.round(L.reduce((t,x)=>t+x.data.nota,0)/L.length*100)/100,zeradas:L.filter(x=>x.data.zerada).length,agentes:new Set(L.map(x=>x.data.agente)).size,responsavel:[...new Set(L.map(x=>moAvaliador(x.criado_por)))].join(', ')};MA.memo.set(mk,res);return res}
/* valores da semana para um setor: digitado vence; vazio usa o automático. _usados/_dif dizem de onde veio cada um */
function qEf(w,id){const man=(w&&w.q&&w.q[id])||{},au=maAuto(w,id);if(!au)return man;const r={...man},usados=[],dif=[];
 MA_CAMPOS.forEach(k=>{if(isN(man[k])){if(man[k]!==au[k])dif.push(k)}else{r[k]=au[k];usados.push(k)}});
 if(man.responsavel){if(man.responsavel!==au.responsavel)dif.push('responsavel')}else{r.responsavel=au.responsavel;usados.push('responsavel')}
 r._auto=au;r._usados=usados;r._dif=dif;return r}
/* linha da tabela da Qualidade: de onde vieram os números */
const maOrigem=r=>!r._auto?'':r._dif.length?`<span class="by maw">Preenchido manualmente · monitorias do sistema: ${nf(r._auto.monitorias)} (${pct(r._auto.qualidade)})</span>`:r._usados.length?`<span class="by">${r._usados.length===5?'Calculado das':'Completado com as'} monitorias do sistema</span>`:'';
/* no formulário: dica com o número das monitorias nos campos vazios */
const maPh=(w,f,id,k,t,r)=>{if(f!=='q'||id==='sla'||(k==='responsavel'?r[k]:isN(r[k])))return '';const au=maAuto(w,id);if(!au||(k!=='responsavel'&&!isN(au[k])))return '';return ` placeholder="${esc(k==='responsavel'?au.responsavel:raw(t,au[k]))} (monitorias)"`};
function maBox(w,f,id,r,ro){if(f!=='q'||id==='sla')return '';const au=maAuto(w,id);if(!au)return '';
 const manual=MA_CAMPOS.some(k=>isN(r[k]))||!!r.responsavel;
 return `<div class="maauto"><b>Das monitorias do sistema</b><span>${nf(au.monitorias)} ${au.monitorias===1?'monitoria':'monitorias'} · qualidade ${pct(au.qualidade)} · ${nf(au.zeradas)} ${au.zeradas===1?'zerada':'zeradas'} · ${nf(au.agentes)} ${au.agentes===1?'agente':'agentes'}</span><small>Responsáveis: ${esc(au.responsavel)}</small>
 <small class="muted">${manual?'Há números digitados à mão: eles valem no lugar destes.':'Os campos vazios usam estes números. O que for digitado vale no lugar deles.'}</small>${manual&&!ro?'<div><button class="btn sm" data-usarauto>Usar o automático</button></div>':''}</div>`}
